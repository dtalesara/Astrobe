[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "astrobe"
version = "1.0.0"
description = "Unified astrobiology analysis pipeline — Core · BioSearch · HOPE · DigitalDNA"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "scipy>=1.10",
]

[project.scripts]
astrobe = "astrobe.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["astrobe*"]
